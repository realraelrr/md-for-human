[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-for-human"
version = "0.1.1"
description = "Turn agent-generated Markdown into human-friendly HTML reading sites."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "markdown-it-py>=3.0,<4",
  "pygments>=2.17,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "types-Pygments>=2.19,<3",
]

[project.scripts]
md-for-human = "md_for_human.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
python_version = "3.11"
