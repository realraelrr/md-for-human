[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-for-human"
version = "0.1.0"
description = "Turn agent-generated Markdown into human-friendly HTML reading sites."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "markdown-it-py",
  "pygments",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
md-for-human = "md_for_human.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
